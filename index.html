<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator</title>
		<link rel="stylesheet" href="style.css" />
		<script src="code.js" defer></script>
	</head>
	<body>
		<h1>Calc it!</h1>
		<p>(Calc is short for calculator)</p>
		<main class="calculator">
			<h2 id="display"></h2>
			<button class="operator addition" id="addition">+</button>
			<button class="operator subtraction" id="subtraction">-</button>
			<button class="operator multiplication" id="multiplication">x</button>
			<button class="operator division" id="division">/</button>
			<button class="number">1</button>
			<button class="number">2</button>
			<button class="number">3</button>
			<button class="number">4</button>
			<button class="number">5</button>
			<button class="number">6</button>
			<button class="number">7</button>
			<button class="number">8</button>
			<button class="number">9</button>
			<button class="number">0</button>
			<button class="decimal" id="decimal">.</button>
			<button class="clear" id="clear">AC</button>
			<button class="equal" id="equal">=</button>
		</main>
	</body>
</html>
